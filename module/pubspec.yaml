name: im_sdk_module
description: Native add-to-app build wrapper for the self-contained IM SDK.
publish_to: none
version: 0.1.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  im_sdk:
    path: ../packages/im_sdk

dependency_overrides:
  record_linux: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
  module:
    androidX: true
    androidPackage: com.startlink.im_sdk_module
    iosBundleIdentifier: com.startlink.imSdkModule
